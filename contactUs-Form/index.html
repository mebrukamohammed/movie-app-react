<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
    <script src="index.js" defer></script>
</head>
<body>
    <form id="contactUsForm">
<div class="holderDiv">
    <h1 id="heading">Get in Touch</h1>
    <p id="introText">Please fill out the form below to reach out.</p>
<div class="firstBlock">
    <div class="name-input">
    <i class="fa-solid fa-user"></i><input id="name" type="text" placeholder="name">
    </div>
    <div class="email-input">
        <i class="fa-solid fa-envelope"></i>
        <input id="email" type="email" placeholder="email">
    </div>
</div>
<div class="secondBlock">
    <div class="phone-input">
        <i class="fa-solid fa-phone"></i>
        <input id="phone" type="tel" placeholder="phone(optional)"> 
    </div>
    <div class="subject-input">
        <i class="fa-solid fa-book"></i>
        <input id="subject" type="text" placeholder="subject">
    </div>
</div>
<div class="message-input">
    <i class="fa-solid fa-message"></i>
    <textarea id="message" placeholder="message"></textarea>

</div>

    
<button id="sendMessage" type="button"> Send Message <i class="fa-solid fa-paper-plane"></i></button>
<div class="contact-info">
<p id="location"><i class="fa-solid fa-location-dot"></i> 4 killo, Addis Ababa</p>
<p id="email"> <i class="fa-solid fa-envelope"></i>mebrukaaa7612@gmail.com</p>
<p id="phone"> <i class="fa-solid fa-phone"></i>+251993092854</p>
</div>









</div>
</form>
    
</body>
</html>
