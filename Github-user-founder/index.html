<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github user finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

</head>
<body>
    <div class="container">
      <header>
    <h1 class="header"> <i class="fa-brands fa-github"></i> Github User Finder</h1>
    <p>Search for any github user profile</p>
   </header>
   <div class="search-container">
    <input id="search" type="text" placeholder="enter name" autocomplete="off">
    <button id="search-btn">Search</button>
   </div>
   <div id="profile-container" class="hidden">
    <div class="profile-header">
        <img src="" alt="profile-avatar" id="avatar">
        <div class="profile-info">
        <h2 id="name"></h2>
         <p id="username"></p>
         <p id="bio"></p>
         
     <div class="location-date">
        <p> <i class="fa-solid fa-location-crosshairs"></i> <span id="location"> Not Specified</span></p>
        <p> <i class="fa-solid fa-calendar-days"></i> joined<span id="joined-date"></span></p>
     </div>
     <a href="" id="profile-link" target="_blank" class="btn">View Profile</a>


        </div>
    </div>
    <div class="stats">
        <div class="stat"> 
            <i class="fa-solid fa-users"></i>
            <span id="followers"></span>Followers
        </div>
        <div class="stat">
              <i class="fa-solid fa-user-check"></i>
            <span id="following"></span>Following
        </div>
        <div class="stat">
              <i class="fa-solid fa-code-branch"></i>
            <span id="repo"></span>repositories
        </div>
    </div>
    <div class="additional-info">
    <div class="info-item" id="company-container">
        <i class="fa-solid fa-building"></i><span id="company"> not Specified</span>
        </div>
        <div class="info-item" id="blog-container">
        <i class="fa-solid fa-globe"></i>
         <a id="blog" target="_blank">no website</a>
        </div>
     <div class="info-item" id="twitter-container">
        <i class="fa-brands fa-twitter"></i><a id="twitter" target="_blank">not Specified</a>
        </div>

    </div>
    <div class="repos-section">
        <h3>Latest Repostories</h3>
        <div id="repos-container">
            <div class="loading-repos">Loading Repositories...</div>

        </div>
    </div>


   </div>
   <div id="error-container" class="hidden">
    <p> No user found with specified username. please try another name.</p>
   </div>



   </div>




    
    <script src="script.js"></script>
    
</body>
</html>
